<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3f0ff" />
      <stop offset="100%" stop-color="#e8e2fd" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6342f5" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="250" cy="250" r="240" fill="url(#bgGrad)" />
  
  <!-- Dashed guide border -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="#6342f5" stroke-width="2.5" stroke-dasharray="8 8" opacity="0.4" />

  <!-- Stylized Person Silhouette -->
  <g fill="url(#avatarGrad)" opacity="0.35">
    <!-- Head -->
    <circle cx="250" cy="190" r="65" />
    <!-- Shoulders / Torso -->
    <path d="M130 390 C135 300 200 275 250 275 C300 275 365 300 370 390 C360 410 330 420 250 420 C170 420 140 410 130 390 Z" />
  </g>

  <!-- Upload Prompt / Badge -->
  <g transform="translate(175, 220)">
    <rect x="0" y="0" width="150" height="48" rx="24" fill="#ffffff" filter="drop-shadow(0px 8px 16px rgba(99, 66, 245, 0.15))"/>
    <!-- Camera Icon -->
    <path d="M40 24 C40 21.8 41.8 20 44 20 H49 L51 17 H63 L65 20 H70 C72.2 20 74 21.8 74 24 V34 C74 36.2 72.2 38 70 38 H44 C41.8 38 40 36.2 40 34 Z" fill="#6342f5" fill-opacity="0.2"/>
    <circle cx="57" cy="29" r="4.5" fill="#6342f5"/>
    <text x="75" y="30" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#6342f5" dominant-baseline="middle">YOUR PHOTO</text>
  </g>
</svg>

